    <!-- Instant Theme Bootstrap (Prevents Theme Flash on Refresh) -->
    <script>
      (function() {
        try {
          var bg = localStorage.getItem('app_bg_theme');
          if (!bg) {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && k.startsWith('office_v2_') && k.endsWith('_profile')) {
                var p = JSON.parse(localStorage.getItem(k) || '{}');
                if (p && p.bgTheme) { bg = p.bgTheme; break; }
              }
            }
          }
          if (!bg) { bg = 'light_cream'; }
          var isDark = (bg === 'dark_warm' || bg === 'dark_oled' || bg === 'dark_slate');
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
